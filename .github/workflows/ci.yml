name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: win-clang,        os: windows-latest }
          - { preset: linux-clang-asan, os: ubuntu-24.04 }
          - { preset: linux-arm64,      os: ubuntu-24.04 }

    steps:
      - uses: actions/checkout@v4

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang
          if [ "${{ matrix.preset }}" = "linux-arm64" ]; then
            sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu qemu-user
          fi

      - name: Tool versions
        shell: bash
        run: |
          cmake --version | head -1
          ninja --version
          if [ "$RUNNER_OS" = "Windows" ]; then clang-cl --version; else clang++ --version; fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
