name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The windows-2025 label is moving to the VS 2026 image; the toolset pin below copes with both.
          - { preset: win-clang,        os: windows-2025 }
          - { preset: linux-clang-asan, os: ubuntu-26.04 }
          # Native arm64, the way shaped-core tests it.
          - { preset: linux-clang,      os: ubuntu-26.04-arm }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # shaped-core's ConfigureEnvironment expects a VS developer environment.
      # vcvars64 sets it up; its variables are exported to the later steps.
      # -vcvars_ver=14.44 pins the VS 2022 toolset: VS 2026's default MSVC 14.52 STL refuses
      # Clang < 22, and the runner's clang-cl is LLVM 20. Both runner images ship 14.44.
      # Drop the pin once the runner's LLVM is 22 or newer.
      - name: Enter VS developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" -vcvars_ver=14.44 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($matches[1])=$($matches[2])" >> $env:GITHUB_ENV }
          }
          if ($LASTEXITCODE) { throw "vcvars64 failed (is MSVC 14.44 installed?)" }

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Tool versions
        shell: bash
        run: |
          cmake --version | head -1
          ninja --version
          if [ "$RUNNER_OS" = "Windows" ]; then clang-cl --version; else clang++-21 --version; fi

      # shaped-core builds with Clang 21 on Linux; the runner ships it beside older ones.
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cmake --preset ${{ matrix.preset }} -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21
          else
            cmake --preset ${{ matrix.preset }}
          fi

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
